name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_SUPABASE_PROJECT_ID: "gnjagxdjufbpznpqblsy"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduamFneGRqdWZicHpucHFibHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDYxNzIsImV4cCI6MjA5NTAyMjE3Mn0.4XmI-1HhCNYQDQSmXNDkH5BwtEexpQEv-AYhVRrQD5c"
          VITE_SUPABASE_URL: "https://gnjagxdjufbpznpqblsy.supabase.co"
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: "AIzaSyBmvJph4LmrbtW7skeczzpBIyb9WWzFKo4"
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_TRACKING_ID: "e97ded5a694af9cf797888df3970143e"
        run: npm run build

      - name: Generate Offline HTML
        run: |
          cd dist/client
          JS_FILE=$(ls assets/index-*.js | head -n 1)
          CSS_FILE=$(ls assets/styles-*.css 2>/dev/null | head -n 1 || echo "")
          if [ -z "$CSS_FILE" ]; then CSS_FILE=$(ls assets/index-*.css 2>/dev/null | head -n 1 || echo ""); fi
          
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <title>Roadly</title>
              ${CSS_FILE:+<link rel="stylesheet" href="/$CSS_FILE" />}
            </head>
            <body>
              <script type="module" src="/$JS_FILE"></script>
            </body>
          </html>
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
